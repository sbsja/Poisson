# ==========================================================================
# Layered Scenario Model - Configuration v6 (rare-combination unknowns)
# Units: durations in seconds, distances in miles, speed in mph.
# ==========================================================================

# Profile identity is included in console output, summary.md, and stats.json.
profile_name: generated_elements_v6
profile_kind: generated_elements

# --- Reproducibility ------------------------------------------------------
# One independent, configurable seed per random source. The same config
# (all seeds included) always produces identical results.
seeds:
  element_count: 12345        # generated layer element counts
  rarity_assignment: 23456    # generated layer rarity placement
  transition_matrix: 34567    # Dirichlet sampling of transition vectors
  duration: 45678             # Gamma duration sampling (initial + simulation)
  initial_state: 56789        # initial element selection per layer
  transition_sampling: 67890  # next-element selection during simulation
  combination_selection: 78901 # exact C3-C6 rule selection

# --- Simulation run -------------------------------------------------------
target_total_hours: 20000       # Stop exactly after this simulated time.
average_speed_mph: 50.0         # delta_miles = average_speed_mph * dt / 3600
min_duration_seconds: 1.0       # Lower clamp for every sampled duration.

# --- Output statistics ------------------------------------------------------
mileage_window_miles: 10000     # Window size for per-window episode-start
                                # counts, mean, variance, dispersion index.

# --- Transition behavior -----------------------------------------------------
# "independent" is the original model and remains the default. Every layer
# samples from its permanent probability vector without considering the other
# layers. Conditional rules may remain configured while mode is independent;
# they are not compiled, evaluated, or allowed to consume RNG state.
transition_model:
  mode: independent             # "independent" | "conditional"
  conditional:
    apply_to_initial_state: true
    rules: []

# A matching rule multiplies the target layer's base probabilities and the
# result is normalized before sampling. Different condition layers are AND;
# elements/rarities within one layer are OR. Dependencies must be acyclic.

# --- Direct user percentages (each mapping must sum to 100) ------------------
# element_class_percentages controls how many generated elements belong to
# each class. Integer counts use the largest-remainder method.
element_class_percentages:
  common:     70.0
  rare:       20.0
  unknown:    10.0

# selection_class_percentages controls the exact total probability mass of
# each class. That mass is distributed among the generated elements in the
# class; there are no rarity weights and no solved unknown weight.
selection_class_percentages:
  common:     70.0
  rare:       20.0
  unknown:    10.0

# --- One duration distribution per element ---------------------------------
# Each element receives its own Gamma parameters. Its mean is placed at a
# stable position inside the rarity band using generated element order. The bands do not
# overlap: every common mean is longer than every rare mean, and every rare
# mean is longer than every unknown mean.
duration_profiles:
  common:  {mean_multiplier: 1.50, coefficient_of_variation: 0.45, element_spread: 0.10}
  rare:    {mean_multiplier: 0.75, coefficient_of_variation: 0.60, element_spread: 0.10}
  unknown: {mean_multiplier: 0.25, coefficient_of_variation: 0.80, element_spread: 0.10}

# --- Unknown scenarios: selected exact rare-element combinations ------------
# Ck contains k rare elements from k distinct layers. Every rule includes one
# rare triggering condition. A rule matches only when the complete active rare
# set equals that rule; other layers must therefore be common (not unknown).
unknown_scenarios:
  enabled: true
  combination_counts: {3: 40, 4: 30, 5: 20, 6: 10}
  require_triggering_condition: true
  exact_rare_set: true

# --- Transition probability vectors ----------------------------------------
# A single Dirichlet draw varies probabilities between elements. When true,
# each class is rescaled to its exact selection_class_percentages mass. When
# false, the raw Dirichlet vector is kept: class masses vary reproducibly around
# those percentages, while the complete vector still sums to one.
concentration_scale: 20000.0
rescale_transition_class_masses: true
allow_self_transition: true

# --- Per-layer configuration ------------------------------------------------
# Every layer is generated from an inclusive element-count range.
layers:
  street:
    mean_duration: 300.0
    variance_duration: 20000.0
    element_count_min: 12
    element_count_max: 12

  temporal_modifications:     # work zones / temporary traffic management
    mean_duration: 600.0
    variance_duration: 90000.0
    element_count_min: 40
    element_count_max: 45

  ego_maneuver:               # ego vehicle maneuver classes
    mean_duration: 30.0
    variance_duration: 400.0
    element_count_min: 20
    element_count_max: 24

  ru_maneuver:                # road-user (surrounding vehicle) maneuvers
    mean_duration: 45.0
    variance_duration: 900.0
    element_count_min: 20
    element_count_max: 24

  environmental_conditions:
    mean_duration: 1800.0
    variance_duration: 500000.0
    element_count_min: 22
    element_count_max: 22

  triggering_conditions:      # unexpected AV triggering condition
    mean_duration: 120.0
    variance_duration: 8000.0
    element_count_min: 80
    element_count_max: 90
