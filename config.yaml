# ==========================================================================
# Layered Scenario Model - Configuration v5 (semantic element catalogs)
# Units: durations in seconds, distances in miles, speed in mph.
# ==========================================================================

# Profile identity is included in console output, summary.md, and stats.json.
profile_name: semantic_catalog_v5s
profile_kind: semantic_catalog

# --- Reproducibility ------------------------------------------------------
# One independent, configurable seed per random source. The same config
# (all seeds included) always produces identical results.
seeds:
  element_count: 12345        # legacy generated layers only
  rarity_assignment: 23456    # legacy generated layers only
  transition_matrix: 34567    # Dirichlet sampling of transition vectors
  duration: 45678             # Gamma duration sampling (initial + simulation)
  initial_state: 56789        # initial element selection per layer
  transition_sampling: 67890  # next-element selection during simulation
  pattern_rules: 78901        # retained for optional pattern rules (disabled)

global_seed: 42               # Used only if optional hash combinations are enabled.

# --- Simulation run -------------------------------------------------------
target_total_miles: 2000000     # Stop once simulated mileage reaches this.
average_speed_mph: 50.0         # delta_miles = average_speed_mph * dt / 3600
min_duration_seconds: 1.0       # Lower clamp for every sampled duration.

# --- Output statistics ------------------------------------------------------
mileage_window_miles: 10000     # Window size for per-window episode-start
                                # counts, mean, variance, dispersion index.

# --- Transition behavior -----------------------------------------------------
# "independent" is the original model and remains the default. Every layer
# samples from its permanent probability vector without considering the other
# layers. Conditional rules may remain configured while mode is independent;
# they are not compiled, evaluated, or allowed to consume RNG state.
transition_model:
  mode: independent             # "independent" | "conditional"
  conditional:
    apply_to_initial_state: true
    rules: []

# To enable conditional transitions, set mode: conditional, disable
# full_scenario_unknowns below (its current product classifier assumes
# independence), and add rules. Example:
#
#    rules:
#      - id: merge_affects_ego
#        target_layer: ego_maneuver
#        when:
#          street:
#            elements: [forced_merge_proceeding, forced_merge_merging]
#        multipliers:
#          elements: {merge: 4.0}
#          rarities: {rare: 1.5, common: 0.7}
#
# A matching rule multiplies the target layer's base probabilities and the
# result is normalized before sampling. Different condition layers are AND;
# elements/rarities within one layer are OR. Dependencies must be acyclic.
# The v5 default uses stable semantic IDs, so rules do not change when
# element-count or rarity-assignment seeds change.

# --- Unknown combinations ------------------------------------------------------
# Pattern and hash combinations are disabled.
enable_unknown_combinations: false
enable_hash_combinations: false

# Route 2: unknown triggering-condition elements are represented as one
# dedicated hidden category, separate from normal visible-layer elements.
enable_hidden_triggering_unknowns: true

# --- Full-scenario rarity unknowns (v4) --------------------------------------
# A COMPLETE six-layer tuple S is an unknown scenario iff its stationary
# probability P(S) = product of the six realized transition-vector
# probabilities is <= calibrated_rarity_threshold. The threshold is
# calibrated once at initialization by deterministic Monte Carlo (dedicated
# calibration_seed; no other RNG stream is touched): N tuples are drawn
# from the stationary product distribution and the threshold is set to the
# target quantile, so the total stationary MASS (not the tuple count) of
# rare all-known tuples ~= target_stationary_mass. Tuples containing any
# unknown element are excluded, because they are handled by routes 1 or 2.
# The achieved sampled mass is
# reported in summary.md / stats.json. No hashing, no partial-layer
# patterns; every classification uses all six current layers.
full_scenario_unknowns:
  enabled: true
  target_stationary_mass: 0.004   # ~0.4% of simulated time in expectation
  calibration_samples: 2000000
  calibration_seed: 90123

# --- Rarity category proportions (must sum to 1.0) ------------------------
# Layers with allow_unknown: false use the four known proportions
# renormalized to sum to 1 (unknown share removed).
rarity_proportions:
  common:     0.50
  medium:     0.25
  rare:       0.10
  very_rare:  0.05
  unknown:    0.10

# --- Base transition weights per rarity (unknown handled separately) -------
base_weights:
  common:     1.0
  medium:     0.4
  rare:       0.1
  very_rare:  0.03

# --- Unknown element weighting --------------------------------------------
unknown_weight_mode: calculated             # "calculated" | "fixed"
target_unknown_element_probability: 0.004   # used when mode = calculated
fixed_unknown_weight: 0.001                 # used when mode = fixed

# --- Transition probability vectors ----------------------------------------
# concentration_scale = 20000 chosen by the study in concentration_study.md:
# smallest tested value for which >= 95% of Dirichlet draws land within
# +/-25% of the 0.4% unknown-rate design target (old default 100 gave ~10%).
# Lower it consciously if more random transition behavior is wanted.
concentration_scale: 20000.0
allow_self_transition: true

# --- Per-layer configuration ------------------------------------------------
# v5 uses fixed, versioned semantic catalogs for every non-street layer.
# Rarity assignments are engineering assumptions, not empirical estimates.
# Legacy element_count_min/max generated layers remain supported.
# shape = mean^2/var, scale = var/mean.
layers:
  street:
    # Fixed real route-composition elements; their probabilities are used
    # EXACTLY as the permanent transition vector (no Dirichlet) and as the
    # initial-state distribution. All elements are known.
    mean_duration: 300.0
    variance_duration: 20000.0
    allow_unknown: false
    fixed_elements:
      - {name: constant_lane,            probability: 0.493}
      - {name: forced_merge_proceeding,  probability: 0.169}
      - {name: road_split_proceeding,    probability: 0.079}
      - {name: lane_split_proceeding,    probability: 0.072}
      - {name: added_lane_proceeding,    probability: 0.034}
      - {name: road_split_exiting,       probability: 0.014}
      - {name: lane_split_exiting,       probability: 0.013}
      - {name: removed_lane,             probability: 0.012}
      - {name: forced_merge_merging,     probability: 0.010}
      - {name: added_lane_merging,       probability: 0.006}
      - {name: added_lane,               probability: 0.003}
      - {name: overlap_zone,             probability: 0.095}

  temporal_modifications:     # work zones / temporary traffic management
    mean_duration: 600.0
    variance_duration: 90000.0
    allow_unknown: true
    semantic_catalog:
      version: "1.0"
      elements:
        - {id: lane_closure, label: "Lane closure", description: "One or more normal travel lanes are temporarily closed.", rarity: common}
        - {id: shoulder_closure, label: "Shoulder closure", description: "A road shoulder is temporarily unavailable.", rarity: common}
        - {id: temporary_speed_limit, label: "Temporary speed limit", description: "A temporary regulatory or advisory speed limit is active.", rarity: common}
        - {id: temporary_lane_shift, label: "Temporary lane shift", description: "Traffic is shifted laterally through temporary channelization.", rarity: common}
        - {id: reduced_lane_width, label: "Reduced lane width", description: "Temporary controls reduce the usable lane width.", rarity: medium}
        - {id: temporary_barrier, label: "Temporary barrier", description: "Temporary barriers alter the road boundary or available recovery area.", rarity: medium}
        - {id: road_surface_work, label: "Road-surface work", description: "Paving, milling, patching, or related surface work affects travel.", rarity: medium}
        - {id: utility_work, label: "Utility work", description: "Utility activity temporarily changes the normal road environment.", rarity: medium}
        - {id: bridge_work, label: "Bridge work", description: "Temporary traffic control is associated with bridge maintenance or construction.", rarity: medium}
        - {id: flagger_control, label: "Flagger control", description: "A human flagger controls alternating or restricted traffic movement.", rarity: rare}
        - {id: temporary_signal, label: "Temporary traffic signal", description: "A temporary signal controls traffic through a modified road section.", rarity: rare}
        - {id: detour, label: "Detour", description: "Normal traffic is redirected onto an alternative route.", rarity: rare}
        - {id: crossover, label: "Median crossover", description: "Traffic crosses a median onto a temporary opposing-carriageway alignment.", rarity: rare}
        - {id: mobile_work_zone, label: "Mobile work zone", description: "The temporary work activity and its controls move along the road.", rarity: very_rare}
        - {id: incident_management_zone, label: "Incident-management zone", description: "Temporary controls support an active incident response.", rarity: very_rare}
        - {id: unclassified_temporal_modification, label: "Unclassified temporal modification", description: "A temporary road modification not represented by catalog version 1.0.", rarity: unknown}

  ego_maneuver:               # ego vehicle maneuver classes
    mean_duration: 30.0
    variance_duration: 400.0
    allow_unknown: true
    semantic_catalog:
      version: "1.0"
      elements:
        - {id: lane_follow, label: "Lane following", description: "The ego vehicle continues within its current lane.", rarity: common}
        - {id: accelerate, label: "Accelerating", description: "The ego vehicle increases longitudinal speed.", rarity: common}
        - {id: decelerate, label: "Decelerating", description: "The ego vehicle reduces longitudinal speed without emergency braking.", rarity: common}
        - {id: stop, label: "Stopping or stopped", description: "The ego vehicle stops or remains stationary as part of normal operation.", rarity: common}
        - {id: lane_change_left, label: "Lane change left", description: "The ego vehicle moves into an adjacent lane on the left.", rarity: medium}
        - {id: lane_change_right, label: "Lane change right", description: "The ego vehicle moves into an adjacent lane on the right.", rarity: medium}
        - {id: merge, label: "Merge", description: "The ego vehicle enters and joins another traffic stream.", rarity: medium}
        - {id: yield, label: "Yield", description: "The ego vehicle gives priority to another road user or traffic stream.", rarity: medium}
        - {id: turn_left, label: "Turn left", description: "The ego vehicle performs a left turn at a junction or access point.", rarity: rare}
        - {id: turn_right, label: "Turn right", description: "The ego vehicle performs a right turn at a junction or access point.", rarity: rare}
        - {id: diverge, label: "Diverge", description: "The ego vehicle leaves the current traffic stream along a diverging path.", rarity: very_rare}
        - {id: emergency_braking, label: "Emergency braking", description: "The ego vehicle performs high-urgency braking to avoid or mitigate conflict.", rarity: very_rare}
        - {id: unclassified_ego_maneuver, label: "Unclassified ego maneuver", description: "An ego maneuver not represented by catalog version 1.0.", rarity: unknown}

  ru_maneuver:                # road-user (surrounding vehicle) maneuvers
    mean_duration: 45.0
    variance_duration: 900.0
    allow_unknown: true
    semantic_catalog:
      version: "1.0"
      elements:
        - {id: car_following, label: "Car following", description: "A surrounding road user follows another vehicle within the traffic stream.", rarity: common}
        - {id: steady_progress, label: "Steady progress", description: "A surrounding road user proceeds without a major lateral or longitudinal maneuver.", rarity: common}
        - {id: yielding, label: "Yielding", description: "A surrounding road user gives priority to another participant.", rarity: common}
        - {id: stopped_road_user, label: "Stopped road user", description: "A surrounding road user is stationary in or near the relevant roadway.", rarity: common}
        - {id: lane_change_left, label: "Lane change left", description: "A surrounding road user moves into an adjacent lane on the left.", rarity: medium}
        - {id: lane_change_right, label: "Lane change right", description: "A surrounding road user moves into an adjacent lane on the right.", rarity: medium}
        - {id: merging, label: "Merging", description: "A surrounding road user joins the ego vehicle's traffic stream.", rarity: medium}
        - {id: crossing, label: "Crossing", description: "A road user crosses the ego vehicle's intended path.", rarity: medium}
        - {id: cut_in, label: "Cut-in", description: "A surrounding road user enters the ego vehicle's path with limited longitudinal separation.", rarity: rare}
        - {id: cut_out, label: "Cut-out", description: "A leading road user leaves the ego lane and reveals the path ahead.", rarity: rare}
        - {id: overtaking, label: "Overtaking", description: "A surrounding road user passes another participant.", rarity: very_rare}
        - {id: sudden_braking, label: "Sudden braking", description: "A surrounding road user performs abrupt, high-deceleration braking.", rarity: very_rare}
        - {id: wrong_way_movement, label: "Wrong-way or unexpected movement", description: "A road user moves against the expected traffic direction or path.", rarity: very_rare}
        - {id: unclassified_road_user_maneuver, label: "Unclassified road-user maneuver", description: "A road-user maneuver not represented by catalog version 1.0.", rarity: unknown}

  environmental_conditions:   # weather / lighting; NO unknown elements
    mean_duration: 1800.0
    variance_duration: 500000.0
    allow_unknown: false
    semantic_catalog:
      version: "1.0"
      elements:
        - {id: clear_daylight, label: "Clear daylight", description: "Daylight operation with no significant precipitation or visibility restriction.", rarity: common}
        - {id: overcast_daylight, label: "Overcast daylight", description: "Daylight operation under substantial cloud cover.", rarity: common}
        - {id: darkness, label: "Darkness", description: "Night-time operation with limited natural illumination.", rarity: common}
        - {id: artificial_lighting, label: "Artificial lighting", description: "Road illumination is primarily provided by fixed artificial sources.", rarity: common}
        - {id: sun_glare, label: "Sun glare", description: "Low-angle or intense sunlight reduces usable visual contrast.", rarity: medium}
        - {id: light_rain, label: "Light rain", description: "Light precipitation affects visibility or the road surface.", rarity: medium}
        - {id: heavy_rain, label: "Heavy rain", description: "Heavy precipitation substantially reduces visibility or surface friction.", rarity: medium}
        - {id: wet_road, label: "Wet road", description: "The road surface is wet independently of current precipitation intensity.", rarity: medium}
        - {id: snow, label: "Snow", description: "Falling or accumulated snow affects visibility or road condition.", rarity: rare}
        - {id: fog, label: "Fog or mist", description: "Suspended water droplets restrict visibility.", rarity: rare}
        - {id: smoke_or_dust, label: "Smoke or dust", description: "Airborne smoke, dust, or sand restricts visibility.", rarity: very_rare}
        - {id: icy_road, label: "Icy road", description: "Ice or freezing contamination reduces road-surface friction.", rarity: very_rare}
        - {id: strong_wind, label: "Strong wind", description: "Wind may affect vehicle stability or airborne objects.", rarity: very_rare}

  triggering_conditions:      # unexpected AV triggering condition
    mean_duration: 120.0
    variance_duration: 8000.0
    allow_unknown: true
    semantic_catalog:
      version: "1.0"
      elements:
        - {id: sensor_occlusion, label: "Sensor occlusion", description: "A sensor's relevant field of view is partially or fully obstructed.", rarity: common}
        - {id: faded_lane_markings, label: "Faded lane markings", description: "Lane boundaries have weak or degraded visual contrast.", rarity: common}
        - {id: temporary_signage, label: "Temporary signage", description: "Temporary signs alter or supplement normal traffic control information.", rarity: common}
        - {id: partially_obscured_sign, label: "Partially obscured sign", description: "A relevant traffic sign is not fully visible.", rarity: medium}
        - {id: unusual_object, label: "Unusual object", description: "An object with uncommon shape, position, or appearance is present.", rarity: medium}
        - {id: emergency_vehicle, label: "Emergency vehicle", description: "An emergency vehicle creates unusual right-of-way or response demands.", rarity: medium}
        - {id: conflicting_lane_markings, label: "Conflicting lane markings", description: "Permanent and temporary markings provide inconsistent guidance.", rarity: rare}
        - {id: map_mismatch, label: "Map mismatch", description: "The mapped road representation differs materially from the observed scene.", rarity: rare}
        - {id: unexpected_road_geometry, label: "Unexpected road geometry", description: "Road geometry differs from the anticipated or represented layout.", rarity: very_rare}
        - {id: sensor_interference, label: "Sensor interference", description: "Environmental or artificial interference degrades sensor measurements.", rarity: very_rare}
        - {id: unclassified_triggering_condition, label: "Unclassified triggering condition", description: "A triggering condition not represented by catalog version 1.0.", rarity: unknown}
