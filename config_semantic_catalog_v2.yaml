# High-Quality Semantic Catalog Simulator (catalog v2.0)
#
# Fixed, source-traceable catalogs. Counts are deliberately capped where a
# larger number would require weak distinctions or unsupported placeholders.
extends: config.yaml

profile_name: semantic_catalog_v2_high_quality
profile_kind: semantic_catalog

layers:
  temporal_modifications:
    semantic_catalog:
      version: "2.0"
      sources:
        mutcd_part6: "https://mutcd.fhwa.dot.gov/pdfs/11th_Edition/part6.pdf"
        project_unknown_policy: "SEMANTIC_CATALOGS.md#probability-interpretation"
      elements:
        - {id: work_beyond_shoulder, label: "Work beyond shoulder", description: "A work space is outside the shoulder while advance warning can still affect the traveled way; corresponds to MUTCD TA-1.", rarity: common, family: shoulder_and_roadside, source_refs: [mutcd_part6]}
        - {id: blasting_zone, label: "Blasting zone", description: "Temporary traffic control protects road users from scheduled blasting activity near the roadway; corresponds to MUTCD TA-2.", rarity: very_rare, family: shoulder_and_roadside, source_refs: [mutcd_part6]}
        - {id: shoulder_work, label: "Shoulder work", description: "Work occupies a shoulder without closing a normal travel lane; corresponds to MUTCD TA-3.", rarity: common, family: shoulder_and_roadside, source_refs: [mutcd_part6]}
        - {id: mobile_shoulder_operation, label: "Mobile shoulder operation", description: "A short-duration or moving operation progresses along the shoulder; corresponds to MUTCD TA-4.", rarity: common, family: shoulder_and_roadside, source_refs: [mutcd_part6]}
        - {id: freeway_shoulder_closure, label: "Freeway shoulder closure", description: "A freeway shoulder is closed and unavailable as a recovery area; corresponds to MUTCD TA-5.", rarity: medium, family: shoulder_and_roadside, source_refs: [mutcd_part6]}
        - {id: shoulder_minor_encroachment, label: "Shoulder work with minor encroachment", description: "Shoulder work slightly encroaches into the adjacent traveled lane; corresponds to MUTCD TA-6.", rarity: common, family: shoulder_and_roadside, source_refs: [mutcd_part6]}
        - {id: road_closure_with_diversion, label: "Road closure with diversion", description: "Traffic leaves the normal roadway briefly to pass a closed work area; corresponds to MUTCD TA-7.", rarity: rare, family: closures_and_detours, source_refs: [mutcd_part6]}
        - {id: road_closure_offsite_detour, label: "Road closure with off-site detour", description: "The road is closed and traffic follows a signed alternative route; corresponds to MUTCD TA-8.", rarity: rare, family: closures_and_detours, source_refs: [mutcd_part6]}
        - {id: overlapping_route_detour, label: "Overlapping-route detour", description: "A detour temporarily overlaps another numbered or signed route; corresponds to MUTCD TA-9.", rarity: rare, family: closures_and_detours, source_refs: [mutcd_part6]}
        - {id: two_lane_flagger_control, label: "Two-lane closure with flaggers", description: "Flaggers alternate traffic through one available lane on a two-lane road; corresponds to MUTCD TA-10.", rarity: common, family: two_lane_work, source_refs: [mutcd_part6]}
        - {id: two_lane_low_volume_closure, label: "Low-volume two-lane closure", description: "A lane closes on a low-volume two-lane road using simplified alternating control; corresponds to MUTCD TA-11.", rarity: common, family: two_lane_work, source_refs: [mutcd_part6]}
        - {id: two_lane_temporary_signal_control, label: "Two-lane closure with temporary signals", description: "Temporary signals alternate traffic through a single available lane; corresponds to MUTCD TA-12.", rarity: medium, family: two_lane_work, source_refs: [mutcd_part6]}
        - {id: temporary_road_closure, label: "Temporary road closure", description: "Traffic is stopped for a short controlled interval while an activity occupies the road; corresponds to MUTCD TA-13.", rarity: medium, family: two_lane_work, source_refs: [mutcd_part6]}
        - {id: haul_road_crossing, label: "Haul-road crossing", description: "Work vehicles cross the public road at a controlled temporary access; corresponds to MUTCD TA-14.", rarity: rare, family: two_lane_work, source_refs: [mutcd_part6]}
        - {id: center_road_work_low_volume, label: "Center-of-road work on low-volume road", description: "A work space occupies the roadway center while traffic passes on both sides; corresponds to MUTCD TA-15.", rarity: medium, family: two_lane_work, source_refs: [mutcd_part6]}
        - {id: centerline_surveying_low_volume, label: "Centerline surveying on low-volume road", description: "Survey activity progresses along or near the roadway centerline; corresponds to MUTCD TA-16.", rarity: rare, family: two_lane_work, source_refs: [mutcd_part6]}
        - {id: mobile_two_lane_operation, label: "Mobile operation on two-lane road", description: "A moving work activity occupies part of a two-lane roadway; corresponds to MUTCD TA-17.", rarity: medium, family: two_lane_work, source_refs: [mutcd_part6]}
        - {id: minor_street_lane_closure, label: "Minor-street lane closure", description: "A travel lane closes on a lower-volume urban street; corresponds to MUTCD TA-18.", rarity: common, family: urban_street_work, source_refs: [mutcd_part6]}
        - {id: one_direction_detour, label: "One-direction detour", description: "Only one direction of travel is diverted while the opposite direction remains on the normal street; corresponds to MUTCD TA-19.", rarity: medium, family: urban_street_work, source_refs: [mutcd_part6]}
        - {id: closed_street_detour, label: "Closed-street detour", description: "An urban street closes and all affected traffic follows a signed detour; corresponds to MUTCD TA-20.", rarity: medium, family: urban_street_work, source_refs: [mutcd_part6]}
        - {id: near_side_intersection_lane_closure, label: "Near-side intersection lane closure", description: "A lane closes on the approach side of an intersection; corresponds to MUTCD TA-21.", rarity: common, family: intersection_and_pedestrian, source_refs: [mutcd_part6]}
        - {id: far_side_right_lane_closure, label: "Far-side right-lane closure", description: "The right-hand lane closes immediately beyond an intersection; corresponds to MUTCD TA-22.", rarity: medium, family: intersection_and_pedestrian, source_refs: [mutcd_part6]}
        - {id: far_side_left_lane_closure, label: "Far-side left-lane closure", description: "The left-hand lane closes immediately beyond an intersection; corresponds to MUTCD TA-23.", rarity: medium, family: intersection_and_pedestrian, source_refs: [mutcd_part6]}
        - {id: far_side_half_road_closure, label: "Far-side half-road closure", description: "Approximately half the roadway closes beyond an intersection; corresponds to MUTCD TA-24.", rarity: rare, family: intersection_and_pedestrian, source_refs: [mutcd_part6]}
        - {id: intersection_multiple_lane_closure, label: "Multiple lane closures at intersection", description: "More than one approach or departure lane closes within an intersection work area; corresponds to MUTCD TA-25.", rarity: rare, family: intersection_and_pedestrian, source_refs: [mutcd_part6]}
        - {id: intersection_center_closure, label: "Intersection center closure", description: "Work occupies the central conflict area of an intersection; corresponds to MUTCD TA-26.", rarity: rare, family: intersection_and_pedestrian, source_refs: [mutcd_part6]}
        - {id: intersection_side_closure, label: "Intersection side closure", description: "Work occupies one side of an intersection while other movements remain available; corresponds to MUTCD TA-27.", rarity: medium, family: intersection_and_pedestrian, source_refs: [mutcd_part6]}
        - {id: sidewalk_detour_diversion, label: "Sidewalk detour or diversion", description: "Pedestrians are redirected around a closed sidewalk segment; corresponds to MUTCD TA-28.", rarity: common, family: intersection_and_pedestrian, source_refs: [mutcd_part6]}
        - {id: crosswalk_closure_pedestrian_detour, label: "Crosswalk closure and pedestrian detour", description: "A crosswalk closes and pedestrians are guided to another crossing; corresponds to MUTCD TA-29.", rarity: medium, family: intersection_and_pedestrian, source_refs: [mutcd_part6]}
        - {id: multilane_interior_lane_closure, label: "Interior lane closure on multilane street", description: "A non-edge travel lane closes on a multilane street; corresponds to MUTCD TA-30.", rarity: medium, family: multilane_highway_work, source_refs: [mutcd_part6]}
        - {id: uneven_directional_volume_lane_closure, label: "Lane closure with uneven directional volumes", description: "Temporary allocation accommodates substantially different traffic volumes by direction; corresponds to MUTCD TA-31.", rarity: rare, family: multilane_highway_work, source_refs: [mutcd_part6]}
        - {id: high_speed_half_road_closure, label: "Half-road closure on high-speed multilane highway", description: "Approximately half a high-speed multilane roadway closes; corresponds to MUTCD TA-32.", rarity: very_rare, family: multilane_highway_work, source_refs: [mutcd_part6]}
        - {id: divided_highway_stationary_lane_closure, label: "Stationary lane closure on divided highway", description: "A fixed work zone closes a lane on a divided highway; corresponds to MUTCD TA-33.", rarity: common, family: multilane_highway_work, source_refs: [mutcd_part6]}
        - {id: lane_closure_temporary_barrier, label: "Lane closure with temporary barrier", description: "A temporary traffic barrier separates an active lane from a closed work space; corresponds to MUTCD TA-34.", rarity: medium, family: multilane_highway_work, source_refs: [mutcd_part6]}
        - {id: mobile_multilane_operation, label: "Mobile operation on multilane road", description: "A moving work convoy occupies one or more lanes of a multilane roadway; corresponds to MUTCD TA-35.", rarity: medium, family: multilane_highway_work, source_refs: [mutcd_part6]}
        - {id: freeway_lane_shift, label: "Freeway lane shift", description: "Freeway traffic shifts laterally while retaining the same number of through lanes; corresponds to MUTCD TA-36.", rarity: medium, family: freeway_and_ramps, source_refs: [mutcd_part6]}
        - {id: freeway_double_lane_closure, label: "Double lane closure on freeway", description: "Two adjacent freeway travel lanes close through the work zone; corresponds to MUTCD TA-37.", rarity: rare, family: freeway_and_ramps, source_refs: [mutcd_part6]}
        - {id: freeway_interior_lane_closure, label: "Interior lane closure on freeway", description: "An interior freeway lane closes while lanes remain open on both sides; corresponds to MUTCD TA-38.", rarity: rare, family: freeway_and_ramps, source_refs: [mutcd_part6]}
        - {id: freeway_median_crossover, label: "Freeway median crossover", description: "Traffic crosses the median and uses part of the opposing carriageway; corresponds to MUTCD TA-39.", rarity: very_rare, family: freeway_and_ramps, source_refs: [mutcd_part6]}
        - {id: entrance_ramp_median_crossover, label: "Median crossover for entrance ramp", description: "Temporary crossover geometry preserves an entrance-ramp movement through freeway work; corresponds to MUTCD TA-40.", rarity: very_rare, family: freeway_and_ramps, source_refs: [mutcd_part6]}
        - {id: exit_ramp_median_crossover, label: "Median crossover for exit ramp", description: "Temporary crossover geometry preserves an exit-ramp movement through freeway work; corresponds to MUTCD TA-41.", rarity: very_rare, family: freeway_and_ramps, source_refs: [mutcd_part6]}
        - {id: unclassified_shoulder_roadside_modification, label: "Unclassified shoulder or roadside modification", description: "A temporary shoulder or roadside arrangement outside the catalogued MUTCD-derived cases.", rarity: unknown, family: coverage_boundary, source_refs: [project_unknown_policy]}
        - {id: unclassified_closure_detour_modification, label: "Unclassified closure or detour modification", description: "A temporary closure or diversion not represented by the catalogued cases.", rarity: unknown, family: coverage_boundary, source_refs: [project_unknown_policy]}
        - {id: unclassified_intersection_pedestrian_modification, label: "Unclassified intersection or pedestrian modification", description: "A temporary intersection, sidewalk, or crossing arrangement outside the catalogued cases.", rarity: unknown, family: coverage_boundary, source_refs: [project_unknown_policy]}
        - {id: unclassified_freeway_ramp_modification, label: "Unclassified freeway or ramp modification", description: "A temporary freeway, crossover, or ramp arrangement outside the catalogued cases.", rarity: unknown, family: coverage_boundary, source_refs: [project_unknown_policy]}

  ego_maneuver:
    semantic_catalog:
      version: "2.0"
      sources:
        hartjen_urban_maneuvers: "https://mediatum.ub.tum.de/doc/1535131/1535131.pdf"
        project_unknown_policy: "SEMANTIC_CATALOGS.md#probability-interpretation"
      elements: &vehicle_maneuver_catalog
        - {id: accelerate, label: "Accelerate", description: "Increase longitudinal speed while already moving.", rarity: common, family: vehicle_state, source_refs: [hartjen_urban_maneuvers]}
        - {id: driveaway, label: "Drive away", description: "Begin moving from standstill; a specific acceleration maneuver.", rarity: medium, family: vehicle_state, source_refs: [hartjen_urban_maneuvers]}
        - {id: keep_velocity, label: "Keep velocity", description: "Maintain approximately constant non-zero longitudinal speed.", rarity: common, family: vehicle_state, source_refs: [hartjen_urban_maneuvers]}
        - {id: standstill, label: "Standstill", description: "Remain stationary without executing a new departure maneuver.", rarity: common, family: vehicle_state, source_refs: [hartjen_urban_maneuvers]}
        - {id: decelerate, label: "Decelerate", description: "Reduce longitudinal speed without completing a stop.", rarity: common, family: vehicle_state, source_refs: [hartjen_urban_maneuvers]}
        - {id: halt, label: "Halt", description: "Decelerate until the vehicle reaches standstill.", rarity: medium, family: vehicle_state, source_refs: [hartjen_urban_maneuvers]}
        - {id: reversing, label: "Reversing", description: "Travel in reverse rather than in the normal forward direction.", rarity: very_rare, family: vehicle_state, source_refs: [hartjen_urban_maneuvers]}
        - {id: follow_lane, label: "Follow lane", description: "Continue along the current lane without changing lanes.", rarity: common, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: lane_change_left, label: "Lane change left", description: "Move from the current lane into an adjacent lane on the left.", rarity: medium, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: lane_change_right, label: "Lane change right", description: "Move from the current lane into an adjacent lane on the right.", rarity: medium, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: approach_junction, label: "Approach junction", description: "Progress toward a junction before entering its conflict area.", rarity: medium, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: cross_junction, label: "Cross junction", description: "Traverse a junction without executing a classified turn.", rarity: medium, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: turn_left, label: "Turn left", description: "Change direction to the left while traversing a junction or access point.", rarity: medium, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: turn_right, label: "Turn right", description: "Change direction to the right while traversing a junction or access point.", rarity: medium, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: u_turn, label: "U-turn", description: "Reverse travel direction through an intentional U-shaped turning maneuver.", rarity: very_rare, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: approach_crosswalk, label: "Approach crosswalk", description: "Progress toward a marked or otherwise recognized pedestrian crossing.", rarity: medium, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: cross_crosswalk, label: "Cross crosswalk", description: "Traverse the area of a pedestrian crosswalk.", rarity: rare, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: park, label: "Park", description: "Enter, leave, or position within a parking space as the dominant maneuver.", rarity: rare, family: infrastructure_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: follow_object, label: "Follow object", description: "Maintain progression behind a lead traffic participant at approximately matched speed.", rarity: common, family: object_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: approach_object, label: "Approach object", description: "Close longitudinal distance to a lead traffic participant.", rarity: medium, family: object_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: fall_behind_object, label: "Fall behind object", description: "Increase distance behind a lead participant while decelerating or traveling more slowly.", rarity: rare, family: object_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: passing_object, label: "Pass object", description: "Travel past another traffic participant in a neighboring path or lane.", rarity: rare, family: object_relation, source_refs: [hartjen_urban_maneuvers]}
        - {id: unclassified_vehicle_state_maneuver, label: "Unclassified vehicle-state maneuver", description: "A longitudinal or motion-state behavior outside the source-backed vehicle-state catalog.", rarity: unknown, family: coverage_boundary, source_refs: [project_unknown_policy]}
        - {id: unclassified_path_interaction_maneuver, label: "Unclassified path or interaction maneuver", description: "An infrastructure-related or object-related maneuver outside the source-backed catalog.", rarity: unknown, family: coverage_boundary, source_refs: [project_unknown_policy]}

  ru_maneuver:
    semantic_catalog:
      version: "2.0"
      sources:
        hartjen_urban_maneuvers: "https://mediatum.ub.tum.de/doc/1535131/1535131.pdf"
        project_unknown_policy: "SEMANTIC_CATALOGS.md#probability-interpretation"
      elements: *vehicle_maneuver_catalog

  environmental_conditions:
    semantic_catalog:
      version: "2.0"
      sources:
        carla_weather_presets: "https://carla.org/Doxygen/html/da/d0c/LibCarla_2source_2carla_2rpc_2WeatherParameters_8h_source.html"
      elements:
        - {id: clear_noon, label: "Clear noon", description: "Clear daylight with a high sun position and no material precipitation.", rarity: common, family: noon_preset, source_refs: [carla_weather_presets]}
        - {id: cloudy_noon, label: "Cloudy noon", description: "Cloud-covered daylight with no material precipitation.", rarity: common, family: noon_preset, source_refs: [carla_weather_presets]}
        - {id: wet_noon, label: "Wet noon", description: "Clear daylight with a wet road surface but no active rainfall preset.", rarity: medium, family: noon_preset, source_refs: [carla_weather_presets]}
        - {id: wet_cloudy_noon, label: "Wet cloudy noon", description: "Cloudy daylight combined with a wet road surface.", rarity: medium, family: noon_preset, source_refs: [carla_weather_presets]}
        - {id: moderate_rain_noon, label: "Moderate rain at noon", description: "Daylight with moderate rainfall and associated wetness.", rarity: medium, family: noon_preset, source_refs: [carla_weather_presets]}
        - {id: heavy_rain_noon, label: "Heavy rain at noon", description: "Daylight with high rainfall intensity and substantial road wetness.", rarity: rare, family: noon_preset, source_refs: [carla_weather_presets]}
        - {id: light_rain_noon, label: "Light rain at noon", description: "Daylight with light rainfall and limited precipitation deposits.", rarity: medium, family: noon_preset, source_refs: [carla_weather_presets]}
        - {id: clear_sunset, label: "Clear sunset", description: "Clear conditions with a low evening sun position.", rarity: common, family: sunset_preset, source_refs: [carla_weather_presets]}
        - {id: cloudy_sunset, label: "Cloudy sunset", description: "Cloud-covered conditions at sunset without active rainfall.", rarity: medium, family: sunset_preset, source_refs: [carla_weather_presets]}
        - {id: wet_sunset, label: "Wet sunset", description: "Low evening illumination combined with a wet road surface.", rarity: medium, family: sunset_preset, source_refs: [carla_weather_presets]}
        - {id: wet_cloudy_sunset, label: "Wet cloudy sunset", description: "Cloudy sunset conditions combined with a wet road surface.", rarity: rare, family: sunset_preset, source_refs: [carla_weather_presets]}
        - {id: moderate_rain_sunset, label: "Moderate rain at sunset", description: "Low evening illumination with moderate rainfall.", rarity: rare, family: sunset_preset, source_refs: [carla_weather_presets]}
        - {id: heavy_rain_sunset, label: "Heavy rain at sunset", description: "Low evening illumination with heavy rainfall and substantial wetness.", rarity: very_rare, family: sunset_preset, source_refs: [carla_weather_presets]}
        - {id: light_rain_sunset, label: "Light rain at sunset", description: "Low evening illumination with light rainfall.", rarity: rare, family: sunset_preset, source_refs: [carla_weather_presets]}
        - {id: clear_night, label: "Clear night", description: "Night-time conditions with no material cloud or precipitation preset.", rarity: common, family: night_preset, source_refs: [carla_weather_presets]}
        - {id: cloudy_night, label: "Cloudy night", description: "Night-time conditions with substantial cloud cover and no active rainfall.", rarity: medium, family: night_preset, source_refs: [carla_weather_presets]}
        - {id: wet_night, label: "Wet night", description: "Night-time conditions with a wet road surface but no active rainfall preset.", rarity: medium, family: night_preset, source_refs: [carla_weather_presets]}
        - {id: wet_cloudy_night, label: "Wet cloudy night", description: "Cloudy night-time conditions combined with a wet road surface.", rarity: rare, family: night_preset, source_refs: [carla_weather_presets]}
        - {id: moderate_rain_night, label: "Moderate rain at night", description: "Night-time conditions with moderate rainfall.", rarity: rare, family: night_preset, source_refs: [carla_weather_presets]}
        - {id: heavy_rain_night, label: "Heavy rain at night", description: "Night-time conditions with heavy rainfall and substantial wetness.", rarity: very_rare, family: night_preset, source_refs: [carla_weather_presets]}
        - {id: light_rain_night, label: "Light rain at night", description: "Night-time conditions with light rainfall.", rarity: rare, family: night_preset, source_refs: [carla_weather_presets]}
        - {id: dust_storm, label: "Dust storm", description: "Airborne dust substantially reduces visibility and alters atmospheric scattering.", rarity: very_rare, family: particulate_preset, source_refs: [carla_weather_presets]}

  triggering_conditions:
    semantic_catalog:
      version: "2.0"
      sources:
        xing_triggering_ontology: "https://arxiv.org/abs/2210.08724"
        asam_iso34503_taxonomy: "https://publications.pages.asam.net/standards/ASAM_OpenODD/ASAM_OpenODD/latest/specification/11_annexes/11_e_iso34503_02_openscenario_dsl.html"
        iso21448_sotif: "https://www.iso.org/standard/77490.html"
        project_unknown_policy: "SEMANTIC_CATALOGS.md#probability-interpretation"
      elements:
        - {id: dense_fog, label: "Dense fog", description: "Suspended water droplets reduce usable detection range and object contrast.", rarity: medium, family: visibility_and_illumination, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: heavy_rain_visibility_loss, label: "Heavy-rain visibility loss", description: "Heavy rainfall obscures targets or degrades sensor returns enough to challenge perception.", rarity: medium, family: visibility_and_illumination, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: snowfall_visibility_loss, label: "Snowfall visibility loss", description: "Falling snow obscures targets or produces interfering visual and ranging features.", rarity: rare, family: visibility_and_illumination, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: airborne_dust, label: "Airborne dust", description: "Dust or sand reduces contrast and can create spurious sensor returns.", rarity: rare, family: visibility_and_illumination, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: smoke_obscuration, label: "Smoke obscuration", description: "Smoke blocks or distorts the observable features of relevant objects.", rarity: rare, family: visibility_and_illumination, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: water_spray_obscuration, label: "Water-spray obscuration", description: "Spray from vehicles or roadway water temporarily obscures objects and lane features.", rarity: medium, family: visibility_and_illumination, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: low_sun_glare, label: "Low-sun glare", description: "Low-angle sunlight saturates imaging or reduces visual contrast in the driving direction.", rarity: medium, family: visibility_and_illumination, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: low_illumination, label: "Low illumination", description: "Available natural and artificial light is insufficient for reliable visual feature extraction.", rarity: medium, family: visibility_and_illumination, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: abrupt_lighting_transition, label: "Abrupt lighting transition", description: "A rapid change between bright and dark regions challenges exposure adaptation.", rarity: rare, family: visibility_and_illumination, source_refs: [xing_triggering_ontology]}
        - {id: contaminated_sensor_view, label: "Contaminated sensor view", description: "Mud, water, snow, or debris partially blocks a sensor aperture or protective surface.", rarity: medium, family: visibility_and_illumination, source_refs: [xing_triggering_ontology]}
        - {id: faded_lane_markings, label: "Faded lane markings", description: "Lane markings have insufficient contrast for reliable boundary detection.", rarity: common, family: traffic_guidance, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: missing_lane_markings, label: "Missing lane markings", description: "Expected lane boundary markings are absent over a relevant road segment.", rarity: medium, family: traffic_guidance, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: conflicting_lane_markings, label: "Conflicting lane markings", description: "Multiple visible marking sets imply incompatible lane paths.", rarity: rare, family: traffic_guidance, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: temporary_lane_markings, label: "Temporary lane markings", description: "Temporary markings replace or modify the normal lane arrangement.", rarity: medium, family: traffic_guidance, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: partially_obscured_sign, label: "Partially obscured sign", description: "Vegetation, vehicles, dirt, or another object prevents full observation of a relevant sign.", rarity: medium, family: traffic_guidance, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: damaged_or_rotated_sign, label: "Damaged or rotated sign", description: "A sign is physically damaged or oriented away from its expected viewing direction.", rarity: rare, family: traffic_guidance, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
        - {id: nonstandard_sign_appearance, label: "Non-standard sign appearance", description: "A relevant sign differs materially from the forms represented by the perception system.", rarity: rare, family: traffic_guidance, source_refs: [xing_triggering_ontology]}
        - {id: traffic_signal_outage, label: "Traffic-signal outage", description: "A normally active traffic signal is dark or unavailable.", rarity: rare, family: traffic_guidance, source_refs: [xing_triggering_ontology, asam_iso34503_taxonomy]}
